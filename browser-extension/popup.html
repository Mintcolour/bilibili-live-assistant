<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>本机登录同步</title></head>
<body><h1>B站账号 · 本机同步</h1><p>仅将此浏览器的 B站登录状态同步到本机直播助手。</p>
<label>浏览器配置名称<input id="name" maxlength="60" placeholder="例如：个人配置" autocomplete="off"></label>
<button id="pair">连接直播助手</button><button id="complete">已在助手确认，完成连接</button>
<label class="follow"><input id="follow" type="checkbox">自动跟随浏览器</label>
<button id="sync">立即同步</button><button id="disconnect">断开同步</button>
<p id="status" role="status"></p><p id="detail"></p><a href="https://www.bilibili.com/" target="_blank" rel="noopener noreferrer">打开 B站登录</a>
<p class="note">首次连接：先在助手打开“连接浏览器”，安装本机组件并确认来源，再完成连接。关闭浏览器不会替你退出账号。</p>
<script src="popup.js"></script></body></html>
